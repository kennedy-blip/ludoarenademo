# Render Blueprint — Ludo Arena KE
#
# One public service. The app at the repo root is authored in ReScript and
# compiled to static files by Vite:
#
#   buildCommand: npm ci && npm run build    →  dist/
#
# IMPORTANT: the build command must be `npm run build`, not a bare
# `vite build`. `npm run build` runs `rescript build` first; ReScript's `.mjs`
# output is gitignored, so skipping that step fails with
#   [vite:build-html] Failed to resolve /src/Main.mjs
# `postinstall` also runs `rescript build`, so even a bare `vite build` works
# now — but keep the explicit script as the source of truth.
#
# The build shape is unchanged from the previous TypeScript app, so the live
# site https://ludoarenademo-1.onrender.com keeps deploying from the same
# service on every push — no domain move, no downtime.
#
# Pull-request previews are enabled so a branch can be reviewed on its own URL
# without touching production.

previewsEnabled: true

services:
  - type: web
    name: ludoarenademo
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The game runs entirely client-side; these keep it embeddable and stop
      # browsers sniffing content types.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
